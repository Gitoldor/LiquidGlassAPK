<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

#root{
    position:relative;
    width:100%;
    height:100%;
}

/* Something for the glass to refract */
#background{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            135deg,
            #0b5cff,
            #8b5cf6,
            #00c6ff
        );
}

#glass{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    box-sizing:border-box;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-family:Arial,sans-serif;
    font-size:16px;
    font-weight:600;

    border-radius:999px;

    background:rgba(255,255,255,0.08);

}

</style>

</head>

<body>

<div id="root">

    <div id="background"></div>

    <div
        id="glass"
        data-config='{
            "blurAmount":0.35,
            "refraction":0.9,
            "chromAberration":0.08,
            "edgeHighlight":0.18,
            "specular":0.25,
            "fresnel":1,
            "cornerRadius":40,
            "zRadius":40,
            "opacity":0.9,
            "shadowOpacity":0.25
        }'
    >
        ◉
    </div>

</div>

<script type="module">

import { LiquidGlass } from
"https://cdn.jsdelivr.net/npm/@ybouane/liquidglass/dist/index.js";

const root =
document.querySelector("#root");

const glass =
document.querySelector("#glass");

await LiquidGlass.init({

    root: root,

    glassElements: [
        glass
    ]

});

</script>

</body>
</html>
